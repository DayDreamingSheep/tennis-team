<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tennis Plan</title>
<!--
  This page is generated once by setup and never edited. Its content comes from
  _system/plan-data.js, which the Pocket Tennis Team rewrites after each update.
-->
<script src="_system/plan-data.js"></script>
<style>
  :root {
    --bg: #f6f7f2; --card: #ffffff; --ink: #1d2320; --muted: #5d6762;
    --line: #dfe3dc; --accent: #2f6d3a; --accent-soft: #e4efe3;
    --ball: #c9d72f; --warn: #9a5b00; --warn-soft: #fbf0dd;
    --new: #2a5db0; --new-soft: #e3ecfa; --rest: #8a3b3b; --rest-soft: #f7e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141815; --card: #1d221f; --ink: #edf1ec; --muted: #a2aca5;
      --line: #2f3631; --accent: #7cc489; --accent-soft: #233528;
      --ball: #d6e24a; --warn: #f0b85c; --warn-soft: #3a2f1c;
      --new: #8db4f2; --new-soft: #1f2b40; --rest: #ee9a9a; --rest-soft: #3a2323;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 20px; }
  .eyebrow { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ball); display: inline-block; }
  h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 8px; }
  .focus { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  .cards { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .area { color: var(--muted); font-size: 13px; }
  .title { font-size: 18px; font-weight: 600; margin: 2px 0 8px; }
  .chip { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
          background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .chip.new { background: var(--new-soft); color: var(--new); }
  .chip.test, .chip.simplify { background: var(--warn-soft); color: var(--warn); }
  .chip.rest, .chip.swap { background: var(--rest-soft); color: var(--rest); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .cue-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: c; }
  .cue-list li { counter-increment: c; background: var(--card); border: 1px solid var(--line);
                 border-left: 6px solid var(--ball); border-radius: 10px; padding: 12px 14px; font-size: 18px; font-weight: 600; }
  .cue-list li::before { content: counter(c) ". "; color: var(--muted); font-weight: 500; }
  .two { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; } }
  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin: 4px 0; }
  .health { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .health strong { color: var(--warn); }
  ol.steps { margin: 0; padding-left: 22px; font-size: 17px; }
  ol.steps li { margin: 6px 0; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-style: italic; }
  @media print {
    body { background: #fff; color: #000; font-size: 13px; }
    main { padding: 0; max-width: none; }
    .card, .cue-list li { break-inside: avoid; border-color: #bbb; }
    footer { display: none; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  (function () {
    var d = {};
    d = window.PLAN_DATA || {};
    var esc = function (s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    };
    var list = function (items, cls) {
      items = (items || []).filter(Boolean);
      if (!items.length) return '<p class="empty">Nothing yet - keep logging notes.</p>';
      return '<ul class="' + cls + '">' + items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>";
    };
    var cards = (d.assignments || []).map(function (a) {
      return '<article class="card"><div class="card-top"><div>' +
        '<div class="area">' + esc(a.area) + '</div><div class="title">' + esc(a.title) + "</div></div>" +
        '<span class="chip ' + esc(a.status_kind || "keep") + '">' + esc(a.status || "") + "</span></div>" +
        "<dl>" +
        (a.how ? "<dt>How</dt><dd>" + esc(a.how) + "</dd>" : "") +
        (a.cue ? "<dt>Cue</dt><dd>&ldquo;" + esc(a.cue) + "&rdquo;</dd>" : "") +
        (a.target ? "<dt>Target</dt><dd>" + esc(a.target) + "</dd>" : "") +
        "</dl></article>";
    }).join("");
    var cues = (d.cues || []).filter(Boolean).map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");
    var steps = (d.next_steps || []).filter(Boolean).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
    document.getElementById("app").innerHTML =
      "<header>" +
        '<div class="eyebrow"><span class="dot"></span>Pocket Tennis Team plan</div>' +
        "<h1>" + (d.player ? esc(d.player) + "&rsquo;s week" : "Your week") + (d.week_of ? " of " + esc(d.week_of) : "") + "</h1>" +
        (d.focus ? '<p class="focus">' + esc(d.focus) + "</p>" : "") +
        (d.cycle_progress ? '<div class="meta">' + esc(d.cycle_progress) + "</div>" : "") +
      "</header>" +
      "<h2>This week</h2>" +
      '<section class="cards">' + (cards || '<p class="empty">No assignments yet - tell your coach about your next practice.</p>') + "</section>" +
      (cues ? '<h2>Say these on court</h2><ol class="cue-list">' + cues + "</ol>" : "") +
      '<h2>How it is going</h2><div class="two">' +
        '<div class="card"><strong>Getting better</strong>' + list(d.improving, "plain") + "</div>" +
        '<div class="card"><strong>Keeping an eye on</strong>' + list(d.watching, "plain") + "</div>" +
      "</div>" +
      (d.health ? '<div class="health"><strong>Body check:</strong> ' + esc(d.health) + "</div>" : "") +
      (steps ? '<h2>Next steps</h2><ol class="steps">' + steps + "</ol>" : "") +
      "<footer>Updated " + esc(d.updated || "") + ". Your coach updates this page automatically - just keep talking to it.</footer>";
  })();
</script>
</body>
</html>
